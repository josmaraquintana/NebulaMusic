<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <form method="post" action="/autentication" enctype="application/x-www-form-urlencoded">
                <h1>Inicio de Sesión</h1>
                <div>
                    <label for="correo">
                        Correo Electronico:
                    </label>
                    <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="corre@ejemplo.com"
                            required
                            minlength="5"
                            maxlength="100"
                    >
                </div>
                <div>
                    <label for="contrasena">Contraseña</label>
                    <input type="password"
                           name="contrasena"
                           id="contrasena"
                           placeholder="***************"
                           required>
                </div>
                <div>
                    <button type="submit">
                        Iniciar Sesión
                    </button>
                    <button type="reset">
                        Limpiar Formulario
                    </button>
                </div>


            </form>
            <p>¿Aún no tienes una cuenta? <a href="registro.html">Registrate aquí</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
