<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <!-- Escribe tus etiquetas (label) e inputs aquí -->

                <h1>Crear Cuenta</h1>

                <div>
                    <label for="nombre">Nombre Completo: </label>
                    <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Josmara Benitez"
                            required
                            minlength="3"
                            maxlength="80"
                    >
                </div>
                <div>
                    <label for="correo">Correo Electronico: </label>
                    <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="juanito@gmail.com"
                            required
                            maxlength="100"
                    >
                </div>
                <div>
                    <label for="contrasenia">Contraseña: </label>
                    <input
                            type="password"
                            id="contrasenia"
                            name="contrasenia"
                            placeholder="Minimo 8 caracteres"
                            required
                            minlength="8"
                            autocomplete="off"


                    >
                </div>
                <div>
                    <label for="pseudonimo">Pseudonimo</label>
                    <input
                            type="text"
                            id="pseudonimo"
                            name="pseudonimo"
                            required
                            pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                            placeholder="Nebula-2025"
                            minlength="6"


                    >
                </div>

                <div>
                    <label>Género: </label>
                    <input
                            type="radio"
                            id="rad_femenino"
                            name="genero"
                            value="Femenino"
                            required

                    >
                    <label for="rad_femenino">Femenino</label>
                    <input
                            type="radio"
                            id="rad_masculino"
                            name="genero"
                            value="Masculino"

                    >
                    <label for="rad_masculino">Masculino</label>
                    <input
                            type="radio"
                            id="rad_otro"
                            name="genero"
                            value="Otro"

                    >
                    <label for="rad_otro">Otro</label>
                </div>
                <div>
                    <label for="suscripcion">Tipo de suscrición</label>
                    <select id="suscripcion" name="suscripcion" required>
                        <option value="">---------- Selecciona una Opción------------</option>
                        <option value="gratis">Gratis con Anuncioss</option>
                        <option value="premium_mensual">Premium Mensual (99/mes)</option>
                        <option value="premium_anual">Premium Anual (899/año)</option>

                    </select>
                </div>

                <div>

                    <label for="fechaNacimiento">Fecha de Nacimiento</label>
                    <input type="date"
                           id="fechaNacimiento"
                           name="fechaNacimiento"
                           required
                    >
                </div>
                <div>
                    <input type="checkbox" id="terminos" value="aceptado" required>
                    <label for="terminos">Acepto los Términod y Condiciones de Uso</label>

                </div>

                <div>
                    <label for="comentarios">Comentarios o Gustos</label>
                    <textarea
                            id="comentarios"
                            name="comentarios"
                            rows="4"
                            cols="40"
                            placeholder="Cuentanos que musica te gusta"></textarea>
                </div>
                <div>
                    <button type="submit">
                        Crear Cuenta
                    </button>
                    <button type="reset">
                        Limpiar Formulario
                    </button>
                </div>

            </form>

            <p>¿Ya tienes una cuenta? <a href="iniciar-sesion.html">Inciar Sesión</a></p>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
